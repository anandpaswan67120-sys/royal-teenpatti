name: Build Realistic Casino APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Casino Project
        run: |
          flutter create --platforms=android casino_pro
          cd casino_pro
          cat << 'EOF' > lib/main.dart
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]).then((_) => runApp(const ProCasinoApp()));
          }

          class ProCasinoApp extends StatelessWidget {
            const ProCasinoApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Royal Casino VIP',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: const CasinoHubScreen(),
              );
            }
          }

          class CasinoHubScreen extends StatefulWidget {
            const CasinoHubScreen({super.key});
            @override
            State<CasinoHubScreen> createState() => _CasinoHubScreenState();
          }

          class _CasinoHubScreenState extends State<CasinoHubScreen> {
            int chips = 10000;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0F0817),
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  title: const Text("👑 ROYAL CASINO VIP LOBBY", style: TextStyle(color: Colors.amber, fontWeight: FontWeight.bold, fontSize: 16)),
                  actions: [
                    Container(
                      margin: const EdgeInsets.symmetric(vertical: 8, horizontal: 10),
                      padding: const EdgeInsets.symmetric(horizontal: 12),
                      decoration: BoxDecoration(color: const Color(0xFF1E293B), borderRadius: BorderRadius.circular(20), border: Border.all(color: Colors.amber)),
                      alignment: Alignment.center,
                      child: Text("🪙 ₹$chips", style: const TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold, fontSize: 14)),
                    ),
                    IconButton(
                      icon: const Icon(Icons.add_circle, color: Colors.greenAccent),
                      onPressed: () => setState(() => chips += 1000),
                    )
                  ],
                ),
                body: Padding(
                  padding: const EdgeInsets.all(12),
                  child: Row(
                    children: [
                      _gameBox("TEEN PATTI\nVIP TABLE", Icons.style, const [Color(0xFF831843), Color(0xFF500724)], () => Navigator.push(context, MaterialPageRoute(builder: (_) => const RealisticTableScreen()))),
                      const SizedBox(width: 10),
                      _gameBox("DRAGON vs TIGER\nARENA", Icons.flash_on, const [Color(0xFF7C2D12), Color(0xFF451A03)], () => Navigator.push(context, MaterialPageRoute(builder: (_) => const DragonTigerArena()))),
                      const SizedBox(width: 10),
                      _gameBox("ANDAR BAHAR\nLIVE DEAL", Icons.swap_horizontal_circle, const [Color(0xFF064E3B), Color(0xFF022C22)], () => Navigator.push(context, MaterialPageRoute(builder: (_) => const AndarBaharArena()))),
                      const SizedBox(width: 10),
                      _gameBox("7 UP 7 DOWN\nDICE", Icons.casino, const [Color(0xFF1E3A8A), Color(0xFF0F172A)], () => Navigator.push(context, MaterialPageRoute(builder: (_) => const SevenUpArena()))),
                    ],
                  ),
                ),
              );
            }

            Widget _gameBox(String name, IconData icon, List<Color> bg, VoidCallback ontap) {
              return Expanded(
                child: InkWell(
                  onTap: ontap,
                  child: Container(
                    decoration: BoxDecoration(
                      gradient: LinearGradient(colors: bg, begin: Alignment.topCenter, end: Alignment.bottomCenter),
                      borderRadius: BorderRadius.circular(14),
                      border: Border.all(color: Colors.amber, width: 2),
                      boxShadow: [BoxShadow(color: bg.first.withOpacity(0.5), blurRadius: 10)],
                    ),
                    padding: const EdgeInsets.all(10),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.spaceAround,
                      children: [
                        Icon(icon, size: 36, color: Colors.amber),
                        Text(name, textAlign: TextAlign.center, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 12, color: Colors.white)),
                        Container(
                          padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 4),
                          decoration: BoxDecoration(color: Colors.amber, borderRadius: BorderRadius.circular(6)),
                          child: const Text("PLAY", style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 11)),
                        )
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class RealisticTableScreen extends StatefulWidget {
            const RealisticTableScreen({super.key});
            @override
            State<RealisticTableScreen> createState() => _RealisticTableScreenState();
          }

          class _RealisticTableScreenState extends State<RealisticTableScreen> {
            int pot = 400;
            bool seen = false;
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF06140D),
                body: Stack(
                  alignment: Alignment.center,
                  children: [
                    Container(
                      width: MediaQuery.of(context).size.width * 0.9,
                      height: MediaQuery.of(context).size.height * 0.85,
                      decoration: BoxDecoration(
                        gradient: const RadialGradient(radius: 0.8, colors: [Color(0xFF0E7A46), Color(0xFF03331B)]),
                        borderRadius: BorderRadius.circular(160),
                        border: Border.all(color: Colors.amber, width: 6),
                        boxShadow: const [BoxShadow(color: Colors.black, blurRadius: 20)],
                      ),
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          Container(
                            padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 6),
                            decoration: BoxDecoration(color: Colors.black54, borderRadius: BorderRadius.circular(20), border: Border.all(color: Colors.amber)),
                            child: Text("TOTAL POT: ₹$pot", style: const TextStyle(color: Colors.amberAccent, fontWeight: FontWeight.bold, fontSize: 16)),
                          ),
                          const SizedBox(height: 6),
                          const Text("Oval Poker Table - Live Turn", style: TextStyle(color: Colors.white70, fontSize: 11)),
                        ],
                      ),
                    ),
                    Positioned(
                      top: 12,
                      left: 14,
                      child: IconButton(icon: const Icon(Icons.arrow_back, color: Colors.white), onPressed: () => Navigator.pop(context)),
                    ),
                    Positioned(
                      top: 18,
                      child: Row(
                        children: const [
                          _BotSeat("Rahul (Bot)", "₹3,500"),
                          SizedBox(width: 80),
                          _BotSeat("Dealer Live", "VIP"),
                          SizedBox(width: 80),
                          _BotSeat("Pooja (Bot)", "₹4,200"),
                        ],
                      ),
                    ),
                    Positioned(
                      bottom: 14,
                      child: Row(
                        children: [
                          GestureDetector(
                            onTap: () => setState(() => seen = !seen),
                            child: Row(
                              children: ["A♠", "K♥", "Q♦"].map((c) => Container(
                                margin: const EdgeInsets.symmetric(horizontal: 3),
                                width: 48,
                                height: 72,
                                decoration: BoxDecoration(color: seen ? Colors.white : const Color(0xFF1E3A8A), borderRadius: BorderRadius.circular(6), border: Border.all(color: Colors.amber)),
                                alignment: Alignment.center,
                                child: Text(seen ? c : "🂠", style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: seen ? Colors.red : Colors.white)),
                              )).toList(),
                            ),
                          ),
                          const SizedBox(width: 20),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.red), onPressed: () => Navigator.pop(context), child: const Text("PACK")),
                          const SizedBox(width: 8),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.green), onPressed: () => setState(() => pot += 50), child: const Text("CHAAL ₹50")),
                          const SizedBox(width: 8),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, foregroundColor: Colors.black), onPressed: () => Navigator.pop(context), child: const Text("SHOW")),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class _BotSeat extends StatelessWidget {
            final String n, c;
            const _BotSeat(this.n, this.c);
            @override
            Widget build(BuildContext context) {
              return Column(
                children: [
                  const CircleAvatar(radius: 16, backgroundColor: Colors.amber, child: Icon(Icons.person, color: Colors.black, size: 18)),
                  Text(n, style: const TextStyle(color: Colors.white, fontSize: 10, fontWeight: FontWeight.bold)),
                  Text(c, style: const TextStyle(color: Colors.amberAccent, fontSize: 9)),
                ],
              );
            }
          }

          class DragonTigerArena extends StatefulWidget {
            const DragonTigerArena({super.key});
            @override
            State<DragonTigerArena> createState() => _DragonTigerArenaState();
          }

          class _DragonTigerArenaState extends State<DragonTigerArena> {
            String res = "Bet Dragon or Tiger";
            String d = "🐉";
            String t = "🐯";
            void fight(String side) {
              int dN = Random().nextInt(13) + 1;
              int tN = Random().nextInt(13) + 1;
              setState(() {
                d = "$dN ♠";
                t = "$tN ♥";
                res = (side == "Dragon" && dN > tN) || (side == "Tiger" && tN > dN) ? "🎉 $side WON!" : "❌ $side LOST!";
              });
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text("Dragon vs Tiger"), backgroundColor: const Color(0xFF1E0A0A)),
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Text(res, style: const TextStyle(fontSize: 18, color: Colors.amber, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 20),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          _slot("DRAGON", d, Colors.red, () => fight("Dragon")),
                          const Padding(padding: EdgeInsets.symmetric(horizontal: 20), child: Text("VS", style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold, color: Colors.amber))),
                          _slot("TIGER", t, Colors.orange, () => fight("Tiger")),
                        ],
                      )
                    ],
                  ),
                ),
              );
            }
            Widget _slot(String title, String card, Color c, VoidCallback ontap) {
              return Column(
                children: [
                  Text(title, style: TextStyle(color: c, fontWeight: FontWeight.bold, fontSize: 16)),
                  const SizedBox(height: 8),
                  Container(width: 80, height: 110, decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(8), border: Border.all(color: c, width: 2)), alignment: Alignment.center, child: Text(card, style: const TextStyle(fontSize: 22, color: Colors.black, fontWeight: FontWeight.bold))),
                  const SizedBox(height: 10),
                  ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: c), onPressed: ontap, child: const Text("BET ₹100")),
                ],
              );
            }
          }

          class AndarBaharArena extends StatelessWidget {
            const AndarBaharArena({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text("Andar Bahar Live"), backgroundColor: const Color(0xFF042F2C)),
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Text("JOKER: K ♠", style: TextStyle(fontSize: 22, color: Colors.amber, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 24),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent, minimumSize: const Size(130, 48)), onPressed: () => Navigator.pop(context), child: const Text("ANDAR (₹100)")),
                          const SizedBox(width: 20),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.deepOrange, minimumSize: const Size(130, 48)), onPressed: () => Navigator.pop(context), child: const Text("BAHAR (₹100)")),
                        ],
                      )
                    ],
                  ),
                ),
              );
            }
          }

          class SevenUpArena extends StatelessWidget {
            const SevenUpArena({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text("7 Up 7 Down Dice"), backgroundColor: const Color(0xFF1E3A8A)),
                body: Center(
                  child: Row(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.blue, minimumSize: const Size(100, 48)), onPressed: () => Navigator.pop(context), child: const Text("7 DOWN")),
                      const SizedBox(width: 12),
                      ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.red, minimumSize: const Size(100, 48)), onPressed: () => Navigator.pop(context), child: const Text("7")),
                      const SizedBox(width: 12),
                      ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.green, minimumSize: const Size(100, 48)), onPressed: () => Navigator.pop(context), child: const Text("7 UP")),
                    ],
                  ),
                ),
              );
            }
          }
          EOF
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-TeenPatti-Pro-APK
          path: casino_pro/build/app/outputs/flutter-apk/app-debug.apk
