name: Build Realistic Casino APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Landscape Casino App
        run: |
          flutter create --platforms=android myapp
          cd myapp
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]).then((_) {
              runApp(const RoyalCasinoPro());
            });
          }

          class RoyalCasinoPro extends StatelessWidget {
            const RoyalCasinoPro({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Teen Patti Live 3D',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: const LiveTableScreen(),
              );
            }
          }

          class LiveTableScreen extends StatefulWidget {
            const LiveTableScreen({super.key});
            @override
            State<LiveTableScreen> createState() => _LiveTableScreenState();
          }

          class _LiveTableScreenState extends State<LiveTableScreen> {
            int pot = 150;
            int currentBet = 20;
            bool isSeen = false;
            int activeTurn = 0; // 0: User, 1-4: Bots
            List<String> myCards = ["A♠", "K♥", "Q♦"];

            final List<Map<String, dynamic>> seats = [
              {"name": "Rohit", "av": "🧔", "chips": 3500, "status": "Chaal"},
              {"name": "Pooja", "av": "👩", "chips": 2200, "status": "Seen"},
              {"name": "Sameer", "av": "🧑", "chips": 4100, "status": "Blind"},
              {"name": "Tina", "av": "👱‍♀️", "chips": 1800, "status": "Chaal"},
            ];

            void nextTurn() {
              setState(() {
                pot += currentBet;
                activeTurn = 1;
              });

              Timer(const Duration(milliseconds: 1200), () {
                if (!mounted) return;
                setState(() {
                  pot += (currentBet * 3);
                  activeTurn = 0;
                });
              });
            }

            void showWinnerDialog() {
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF0F172A),
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16), side: const BorderSide(color: Colors.amber, width: 2)),
                  title: Row(
                    children: const [
                      Icon(Icons.emoji_events, color: Colors.amber, size: 28),
                      SizedBox(width: 8),
                      Text("WINNER - ANAND!", style: TextStyle(color: Colors.amber, fontWeight: FontWeight.bold)),
                    ],
                  ),
                  content: Text("Badhai ho! Aapne ₹$pot ka pot jeet liya!"),
                  actions: [
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, foregroundColor: Colors.black),
                      onPressed: () {
                        Navigator.pop(ctx);
                        setState(() {
                          pot = 100;
                          isSeen = false;
                        });
                      },
                      child: const Text("NEXT ROUND"),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: RadialGradient(
                      radius: 1.2,
                      colors: [Color(0xFF064E3B), Color(0xFF011A13)],
                    ),
                  ),
                  child: Stack(
                    children: [
                      // Top Bar
                      Positioned(
                        top: 8,
                        left: 16,
                        right: 16,
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                              decoration: BoxDecoration(color: Colors.black45, borderRadius: BorderRadius.circular(12)),
                              child: const Text("VIP TABLE #104", style: TextStyle(color: Colors.amber, fontWeight: FontWeight.bold, fontSize: 11)),
                            ),
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 4),
                              decoration: BoxDecoration(color: Colors.black54, borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.amber)),
                              child: const Text("Dealer: Live Auto Deal", style: TextStyle(color: Colors.white70, fontSize: 11)),
                            ),
                          ],
                        ),
                      ),

                      // Bot Seats on Table
                      Positioned(top: 35, left: 40, child: _playerSeat(seats[0]["name"], seats[0]["av"], seats[0]["chips"], seats[0]["status"])),
                      Positioned(top: 35, left: 240, child: _playerSeat(seats[1]["name"], seats[1]["av"], seats[1]["chips"], seats[1]["status"])),
                      Positioned(top: 35, right: 240, child: _playerSeat(seats[2]["name"], seats[2]["av"], seats[2]["chips"], seats[2]["status"])),
                      Positioned(top: 35, right: 40, child: _playerSeat(seats[3]["name"], seats[3]["av"], seats[3]["chips"], seats[3]["status"])),

                      // Main Oval Center Felt Table
                      Center(
                        child: Container(
                          width: 320,
                          height: 130,
                          decoration: BoxDecoration(
                            color: const Color(0xFF047857),
                            borderRadius: BorderRadius.circular(75),
                            border: Border.all(color: const Color(0xFFD97706), width: 5),
                            boxShadow: [
                              BoxShadow(color: Colors.black.withOpacity(0.6), blurRadius: 20, spreadRadius: 3),
                            ],
                          ),
                          child: Column(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              const Text("TOTAL POT", style: TextStyle(color: Colors.white70, fontSize: 10, letterSpacing: 1.2)),
                              Row(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  const Icon(Icons.monetization_on, color: Colors.amber, size: 24),
                                  const SizedBox(width: 4),
                                  Text("₹$pot", style: const TextStyle(fontSize: 28, color: Colors.amber, fontWeight: FontWeight.bold)),
                                ],
                              ),
                              Text(activeTurn == 0 ? "Aapki Baari Hai!" : "Dusre players soch rahe hain...", style: const TextStyle(color: Colors.white60, fontSize: 10)),
                            ],
                          ),
                        ),
                      ),

                      // Bottom User Seat & Controls
                      Positioned(
                        bottom: 8,
                        left: 16,
                        right: 16,
                        child: Row(
                          crossAxisAlignment: CrossAxisAlignment.end,
                          children: [
                            // User Avatar
                            _playerSeat("Anand (You)", "👑", 5400, isSeen ? "Seen" : "Blind", isMe: true),
                            const SizedBox(width: 20),

                            // User 3 Cards
                            GestureDetector(
                              onTap: () => setState(() => isSeen = !isSeen),
                              child: Column(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  Row(
                                    children: myCards.map((c) => Container(
                                      margin: const EdgeInsets.symmetric(horizontal: 2),
                                      width: 46,
                                      height: 68,
                                      decoration: BoxDecoration(
                                        color: isSeen ? Colors.white : const Color(0xFF1E3A8A),
                                        borderRadius: BorderRadius.circular(6),
                                        border: Border.all(color: Colors.amber, width: 2),
                                      ),
                                      alignment: Alignment.center,
                                      child: Text(
                                        isSeen ? c : "🂠",
                                        style: TextStyle(
                                          fontSize: isSeen ? 16 : 22,
                                          fontWeight: FontWeight.bold,
                                          color: isSeen ? (c.contains("♥") || c.contains("♦") ? Colors.red : Colors.black) : Colors.white,
                                        ),
                                      ),
                                    )).toList(),
                                  ),
                                  const SizedBox(height: 3),
                                  Container(
                                    padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                                    decoration: BoxDecoration(color: Colors.black54, borderRadius: BorderRadius.circular(8)),
                                    child: Text(isSeen ? "BLIND" : "SEE CARDS", style: const TextStyle(color: Colors.amber, fontSize: 9, fontWeight: FontWeight.bold)),
                                  )
                                ],
                              ),
                            ),

                            const Spacer(),

                            // Action Buttons
                            Row(
                              children: [
                                ElevatedButton(
                                  style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFDC2626), minimumSize: const Size(65, 38)),
                                  onPressed: () {},
                                  child: const Text("PACK", style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold)),
                                ),
                                const SizedBox(width: 8),
                                ElevatedButton(
                                  style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF16A34A), minimumSize: const Size(85, 38)),
                                  onPressed: nextTurn,
                                  child: Text("CHAAL ₹$currentBet", style: const TextStyle(fontSize: 11, fontWeight: FontWeight.bold)),
                                ),
                                const SizedBox(width: 8),
                                ElevatedButton(
                                  style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, foregroundColor: Colors.black, minimumSize: const Size(70, 38)),
                                  onPressed: showWinnerDialog,
                                  child: const Text("SHOW", style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold)),
                                ),
                              ],
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _playerSeat(String name, String av, int chips, String tag, {bool isMe = false}) {
              return Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  Container(
                    padding: const EdgeInsets.all(3),
                    decoration: BoxDecoration(
                      shape: BoxShape.circle,
                      border: Border.all(color: isMe ? Colors.greenAccent : Colors.amber, width: 2),
                      boxShadow: [BoxShadow(color: (isMe ? Colors.green : Colors.amber).withOpacity(0.3), blurRadius: 8)],
                    ),
                    child: CircleAvatar(
                      radius: isMe ? 20 : 16,
                      backgroundColor: const Color(0xFF1E293B),
                      child: Text(av, style: TextStyle(fontSize: isMe ? 18 : 15)),
                    ),
                  ),
                  const SizedBox(height: 2),
                  Text(name, style: const TextStyle(fontSize: 10, fontWeight: FontWeight.bold, color: Colors.white)),
                  Container(
                    padding: const EdgeInsets.symmetric(horizontal: 5, vertical: 1),
                    decoration: BoxDecoration(color: Colors.black45, borderRadius: BorderRadius.circular(6)),
                    child: Text("₹$chips", style: const TextStyle(fontSize: 9, color: Colors.greenAccent, fontWeight: FontWeight.bold)),
                  ),
                  Text(tag, style: const TextStyle(fontSize: 8, color: Colors.amberAccent)),
                ],
              );
            }
          }
          EOF
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-TeenPatti-Pro-APK
          path: myapp/build/app/outputs/flutter-apk/app-debug.apk
          
