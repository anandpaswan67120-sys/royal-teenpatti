name: Build Realistic Casino APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Casino Hub App
        run: |
          flutter create --platforms=android myapp
          cd myapp
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]).then((_) {
              runApp(const CasinoMasterApp());
            });
          }

          class CasinoMasterApp extends StatelessWidget {
            const CasinoMasterApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Royal Casino VIP',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF070B14),
                ),
                home: const LoginRegisterScreen(),
              );
            }
          }

          class GameState {
            static double balance = 5000.0;
            static String userName = "Player Anand";
            static bool musicOn = true;
          }

          class LoginRegisterScreen extends StatefulWidget {
            const LoginRegisterScreen({super.key});
            @override
            State<LoginRegisterScreen> createState() => _LoginRegisterScreenState();
          }

          class _LoginRegisterScreenState extends State<LoginRegisterScreen> {
            final TextEditingController _phoneController = TextEditingController(text: "9876543210");

            void enterLobby() {
              Navigator.pushReplacement(
                context,
                MaterialPageRoute(builder: (_) => const CasinoLobbyHubScreen()),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  width: double.infinity,
                  height: double.infinity,
                  decoration: const BoxDecoration(
                    gradient: RadialGradient(
                      radius: 1.2,
                      colors: [Color(0xFF2E1065), Color(0xFF090D16)],
                    ),
                  ),
                  child: Stack(
                    children: [
                      Positioned(
                        top: 12,
                        right: 16,
                        child: IconButton(
                          icon: Icon(GameState.musicOn ? Icons.music_note : Icons.music_off, color: Colors.amber, size: 28),
                          onPressed: () {
                            setState(() => GameState.musicOn = !GameState.musicOn);
                            ScaffoldMessenger.of(context).showSnackBar(
                              SnackBar(content: Text(GameState.musicOn ? "Casino Music: ON" : "Casino Music: OFF"), duration: const Duration(seconds: 1)),
                            );
                          },
                        ),
                      ),
                      Center(
                        child: Container(
                          width: 380,
                          padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 18),
                          decoration: BoxDecoration(
                            color: const Color(0xFF0F172A).withOpacity(0.9),
                            borderRadius: BorderRadius.circular(20),
                            border: Border.all(color: Colors.amber, width: 2),
                            boxShadow: [
                              BoxShadow(color: Colors.amber.withOpacity(0.3), blurRadius: 20),
                            ],
                          ),
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Row(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: const [
                                  Icon(Icons.stars, color: Colors.amber, size: 28),
                                  SizedBox(width: 8),
                                  Text("ROYAL CASINO VIP", style: TextStyle(color: Colors.amber, fontSize: 18, fontWeight: FontWeight.bold, letterSpacing: 1.5)),
                                ],
                              ),
                              const SizedBox(height: 12),
                              TextField(
                                controller: _phoneController,
                                keyboardType: TextInputType.phone,
                                decoration: InputDecoration(
                                  labelText: "Mobile Number",
                                  prefixIcon: const Icon(Icons.phone_android, color: Colors.amber),
                                  filled: true,
                                  fillColor: const Color(0xFF1E293B),
                                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(10)),
                                  isDense: true,
                                ),
                              ),
                              const SizedBox(height: 14),
                              Row(
                                children: [
                                  Expanded(
                                    child: ElevatedButton(
                                      style: ElevatedButton.styleFrom(
                                        backgroundColor: Colors.amber,
                                        foregroundColor: Colors.black,
                                        padding: const EdgeInsets.symmetric(vertical: 10),
                                      ),
                                      onPressed: enterLobby,
                                      child: const Text("LOGIN / REGISTER", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                                    ),
                                  ),
                                  const SizedBox(width: 10),
                                  Expanded(
                                    child: ElevatedButton(
                                      style: ElevatedButton.styleFrom(
                                        backgroundColor: const Color(0xFF0284C7),
                                        padding: const EdgeInsets.symmetric(vertical: 10),
                                      ),
                                      onPressed: enterLobby,
                                      child: const Text("GUEST PLAY", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                                    ),
                                  ),
                                ],
                              ),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class CasinoLobbyHubScreen extends StatefulWidget {
            const CasinoLobbyHubScreen({super.key});
            @override
            State<CasinoLobbyHubScreen> createState() => _CasinoLobbyHubScreenState();
          }

          class _CasinoLobbyHubScreenState extends State<CasinoLobbyHubScreen> {
            void openWallet() {
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF0F172A),
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16), side: const BorderSide(color: Colors.amber)),
                  title: Row(
                    children: const [
                      Icon(Icons.account_balance_wallet, color: Colors.amber),
                      SizedBox(width: 8),
                      Text("Instant UPI Wallet", style: TextStyle(color: Colors.white, fontSize: 16)),
                    ],
                  ),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Text("Balance: ₹${GameState.balance.toInt()}", style: const TextStyle(fontSize: 18, color: Colors.greenAccent, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 16),
                      const Text("Select Instant Add Cash Amount:", style: TextStyle(color: Colors.white70, fontSize: 12)),
                      const SizedBox(height: 10),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [100, 500, 1000, 2000].map((amt) => ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1E293B)),
                          onPressed: () {
                            setState(() => GameState.balance += amt);
                            Navigator.pop(ctx);
                            ScaffoldMessenger.of(context).showSnackBar(
                              SnackBar(content: Text("₹$amt added successfully via UPI!"), backgroundColor: Colors.green),
                            );
                          },
                          child: Text("+₹$amt", style: const TextStyle(color: Colors.amber)),
                        )).toList(),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text("CLOSE", style: TextStyle(color: Colors.white54))),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                      colors: [Color(0xFF1E112A), Color(0xFF070B14)],
                      begin: Alignment.topCenter,
                      end: Alignment.bottomCenter,
                    ),
                  ),
                  child: Column(
                    children: [
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                        color: Colors.black.withOpacity(0.7),
                        child: Row(
                          children: [
                            const CircleAvatar(radius: 16, backgroundColor: Colors.amber, child: Text("👑", style: TextStyle(fontSize: 16))),
                            const SizedBox(width: 8),
                            Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text(GameState.userName, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13, color: Colors.white)),
                                const Text("VIP Member", style: TextStyle(fontSize: 10, color: Colors.amberAccent)),
                              ],
                            ),
                            const Spacer(),
                            GestureDetector(
                              onTap: openWallet,
                              child: Container(
                                padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                                decoration: BoxDecoration(
                                  color: const Color(0xFF1E293B),
                                  borderRadius: BorderRadius.circular(20),
                                  border: Border.all(color: Colors.amber, width: 1.5),
                                ),
                                child: Row(
                                  children: [
                                    const Icon(Icons.monetization_on, color: Colors.amber, size: 18),
                                    const SizedBox(width: 6),
                                    Text("₹${GameState.balance.toInt()}", style: const TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold, fontSize: 14)),
                                    const SizedBox(width: 8),
                                    Container(
                                      padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                                      decoration: BoxDecoration(color: Colors.green, borderRadius: BorderRadius.circular(10)),
                                      child: const Text("ADD CASH", style: TextStyle(color: Colors.white, fontSize: 10, fontWeight: FontWeight.bold)),
                                    ),
                                  ],
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                      Expanded(
                        child: Padding(
                          padding: const EdgeInsets.all(12),
                          child: Row(
                            children: [
                              _gameSlot("TEEN PATTI", "5-Player Oval Table", Icons.style, const [Color(0xFF831843), Color(0xFFBE123C)], () {
                                Navigator.push(context, MaterialPageRoute(builder: (_) => const TeenPattiPlayScreen())).then((_) => setState(() {}));
                              }),
                              const SizedBox(width: 10),
                              _gameSlot("DRAGON vs TIGER", "Card Clash Arena", Icons.bolt, const [Color(0xFF7C2D12), Color(0xFFEA580C)], () {
                                Navigator.push(context, MaterialPageRoute(builder: (_) => const DragonTigerPlayScreen())).then((_) => setState(() {}));
                              }),
                              const SizedBox(width: 10),
                              _gameSlot("ANDAR BAHAR", "Live Joker Deal", Icons.swap_horiz, const [Color(0xFF064E3B), Color(0xFF059669)], () {
                                Navigator.push(context, MaterialPageRoute(builder: (_) => const AndarBaharPlayScreen())).then((_) => setState(() {}));
                              }),
                              const SizedBox(width: 10),
                              _gameSlot("7 UP 7 DOWN", "Casino Dice Game", Icons.casino, const [Color(0xFF1E3A8A), Color(0xFF2563EB)], () {
                                Navigator.push(context, MaterialPageRoute(builder: (_) => const SevenUpPlayScreen())).then((_) => setState(() {}));
                              }),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _gameSlot(String title, String desc, IconData icon, List<Color> colors, VoidCallback onTap) {
              return Expanded(
                child: GestureDetector(
                  onTap: onTap,
                  child: Container(
                    decoration: BoxDecoration(
                      gradient: LinearGradient(colors: colors, begin: Alignment.topLeft, end: Alignment.bottomRight),
                      borderRadius: BorderRadius.circular(16),
                      border: Border.all(color: Colors.amber, width: 2),
                      boxShadow: [BoxShadow(color: colors.last.withOpacity(0.4), blurRadius: 10)],
                    ),
                    padding: const EdgeInsets.all(12),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                              decoration: BoxDecoration(color: Colors.black45, borderRadius: BorderRadius.circular(6)),
                              child: const Text("VIP", style: TextStyle(color: Colors.amber, fontSize: 9, fontWeight: FontWeight.bold)),
                            ),
                            Icon(icon, color: Colors.white, size: 26),
                          ],
                        ),
                        const Spacer(),
                        Text(title, style: const TextStyle(fontSize: 14, fontWeight: FontWeight.bold, color: Colors.white)),
                        Text(desc, style: const TextStyle(fontSize: 9, color: Colors.white70)),
                        const SizedBox(height: 8),
                        Container(
                          alignment: Alignment.center,
                          padding: const EdgeInsets.symmetric(vertical: 6),
                          decoration: BoxDecoration(color: Colors.amber, borderRadius: BorderRadius.circular(8)),
                          child: const Text("PLAY GAME", style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 10)),
                        )
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class TeenPattiPlayScreen extends StatefulWidget {
            const TeenPattiPlayScreen({super.key});
            @override
            State<TeenPattiPlayScreen> createState() => _TeenPattiPlayScreenState();
          }

          class _TeenPattiPlayScreenState extends State<TeenPattiPlayScreen> {
            int pot = 150;
            bool isSeen = false;
            int activeTurn = 0;
            List<String> cards = ["A♠", "K♥", "Q♦"];

            void playTurn() {
              if (GameState.balance < 20) return;
              setState(() {
                GameState.balance -= 20;
                pot += 20;
                activeTurn = 1;
              });
              Timer(const Duration(milliseconds: 1000), () {
                if (!mounted) return;
                setState(() {
                  pot += 60;
                  activeTurn = 0;
                });
              });
            }

            void showWinner() {
              setState(() => GameState.balance += pot);
              showDialog(
                context: context,
                builder: (c) => AlertDialog(
                  backgroundColor: const Color(0xFF0F172A),
                  title: const Text("🏆 ANAND WON!", style: TextStyle(color: Colors.amber, fontWeight: FontWeight.bold)),
                  content: Text("Aapne ₹$pot ka pot jeet liya! Chips wallet me add ho gaye."),
                  actions: [TextButton(onPressed: () { Navigator.pop(c); setState(() => pot = 100); }, child: const Text("NEXT ROUND"))],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    radialGradient: RadialGradient(radius: 1.2, colors: [Color(0xFF064E3B), Color(0xFF011A13)]),
                  ),
                  child: Stack(
                    children: [
                      Positioned(
                        top: 8,
                        left: 12,
                        right: 12,
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            IconButton(icon: const Icon(Icons.arrow_back, color: Colors.white), onPressed: () => Navigator.pop(context)),
                            Text("Wallet: ₹${GameState.balance.toInt()}", style: const TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold)),
                          ],
                        ),
                      ),
                      Positioned(
                        top: 35,
                        left: 50,
                        right: 50,
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceAround,
                          children: const [
                            Text("🧔 Rohit\n₹3500", textAlign: TextAlign.center, style: TextStyle(fontSize: 10)),
                            Text("👩 Pooja\n₹2200", textAlign: TextAlign.center, style: TextStyle(fontSize: 10)),
                            Text("🧑 Sameer\n₹4100", textAlign: TextAlign.center, style: TextStyle(fontSize: 10)),
                            Text("👱‍♀️ Tina\n₹1800", textAlign: TextAlign.center, style: TextStyle(fontSize: 10)),
                          ],
                        ),
                      ),
                      Center(
                        child: Container(
                          width: 280,
                          height: 120,
                          decoration: BoxDecoration(
                            color: const Color(0xFF047857),
                            borderRadius: BorderRadius.circular(70),
                            border: Border.all(color: Colors.amber, width: 4),
                          ),
                          child: Column(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              const Text("TOTAL POT", style: TextStyle(color: Colors.white70, fontSize: 10)),
                              Text("₹$pot", style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.amber)),
                              Text(activeTurn == 0 ? "Aapki baari hai!" : "Bot chal rahe hain...", style: const TextStyle(fontSize: 10, color: Colors.white70)),
                            ],
                          ),
                        ),
                      ),
                      Positioned(
                        bottom: 8,
                        left: 16,
                        right: 16,
                        child: Row(
                          children: [
                            const Text("👑 Anand (You)", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 11)),
                            const SizedBox(width: 12),
                            GestureDetector(
                              onTap: () => setState(() => isSeen = !isSeen),
                              child: Row(
                                children: cards.map((c) => Container(
                                  margin: const EdgeInsets.symmetric(horizontal: 2),
                                  width: 42,
                                  height: 60,
                                  decoration: BoxDecoration(color: isSeen ? Colors.white : const Color(0xFF1E3A8A), borderRadius: BorderRadius.circular(4)),
                                  alignment: Alignment.center,
                                  child: Text(isSeen ? c : "🂠", style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: isSeen ? (c.contains("♥") || c.contains("♦") ? Colors.red : Colors.black) : Colors.white)),
                                )).toList(),
                              ),
                            ),
                            const Spacer(),
                            ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.red), onPressed: () => Navigator.pop(context), child: const Text("PACK")),
                            const SizedBox(width: 8),
                            ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.green), onPressed: playTurn, child: const Text("CHAAL ₹20")),
                            const SizedBox(width: 8),
                            ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, foregroundColor: Colors.black), onPressed: showWinner, child: const Text("SHOW")),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class DragonTigerPlayScreen extends StatefulWidget {
            const DragonTigerPlayScreen({super.key});
            @override
            State<DragonTigerPlayScreen> createState() => _DragonTigerPlayScreenState();
          }

          class _DragonTigerPlayScreenState extends State<DragonTigerPlayScreen> {
            String d = "?";
            String t = "?";
            String res = "Dragon ya Tiger choose karein";

            void fight(String pick) {
              if (GameState.balance < 50) return;
              setState(() {
                GameState.balance -= 50;
                int dN = Random().nextInt(13) + 1;
                int tN = Random().nextInt(13) + 1;
                d = "$dN♠";
                t = "$tN♥";
                if ((dN > tN && pick == "Dragon") || (tN > dN && pick == "Tiger")) {
                  GameState.balance += 100;
                  res = "🔥 $pick JEET GAYA! (+₹100)";
                } else {
                  res = "❌ $pick Haar gaya!";
                }
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text("Dragon vs Tiger Arena"), backgroundColor: const Color(0xFF1E0A0A)),
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Text(res, style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Colors.amber)),
                      const SizedBox(height: 20),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          _slot("DRAGON", d, Colors.red),
                          const Padding(padding: EdgeInsets.symmetric(horizontal: 24), child: Text("VS", style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.amber))),
                          _slot("TIGER", t, Colors.amber),
                        ],
                      ),
                      const SizedBox(height: 24),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.red, minimumSize: const Size(120, 38)), onPressed: () => fight("Dragon"), child: const Text("DRAGON (₹50)")),
                          const SizedBox(width: 16),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, foregroundColor: Colors.black, minimumSize: const Size(120, 38)), onPressed: () => fight("Tiger"), child: const Text("TIGER (₹50)")),
                        ],
                      )
                    ],
                  ),
                ),
              );
            }

            Widget _slot(String title, String val, Color c) {
              return Column(
                children: [
                  Text(title, style: TextStyle(color: c, fontWeight: FontWeight.bold)),
                  const SizedBox(height: 6),
                  Container(
                    width: 60,
                    height: 85,
                    decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(8), border: Border.all(color: c, width: 2)),
                    alignment: Alignment.center,
                    child: Text(val, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Colors.black)),
                  ),
                ],
              );
            }
          }

          class AndarBaharPlayScreen extends StatefulWidget {
            const AndarBaharPlayScreen({super.key});
            @override
            State<AndarBaharPlayScreen> createState() => _AndarBaharPlayScreenState();
          }

          class _AndarBaharPlayScreenState extends State<AndarBaharPlayScreen> {
            String joker = "K♠";
            List<String> andar = [];
            List<String> bahar = [];
            String status = "Andar ya Bahar choose karein!";

            void play(String side) {
              if (GameState.balance < 50) return;
              setState(() {
                GameState.balance -= 50;
                andar = ["7♦", "9♣", "K♠"];
                bahar = ["5♠", "J♥"];
                GameState.balance += 100;
                status = "🎉 $side Match Hua! Aap ₹100 jeete!";
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text("Andar Bahar Live"), backgroundColor: const Color(0xFF042F2C)),
                body: Padding(
                  padding: const EdgeInsets.all(12),
                  child: Column(
                    children: [
                      Text("JOKER: $joker", style: const TextStyle(color: Colors.amber, fontSize: 20, fontWeight: FontWeight.bold)),
                      Text(status, style: const TextStyle(fontSize: 12, color: Colors.white70)),
                      const Spacer(),
                      Row(
                        children: [
                          Expanded(
                            child: Container(
                              height: 60,
                              padding: const EdgeInsets.all(6),
                              decoration: BoxDecoration(border: Border.all(color: Colors.blueAccent), borderRadius: BorderRadius.circular(8)),
                              child: Row(children: [const Text("ANDAR: "), ...andar.map((c) => Container(margin: const EdgeInsets.symmetric(horizontal: 2), padding: const EdgeInsets.all(4), color: Colors.white, child: Text(c, style: const TextStyle(color: Colors.red))))]),
                            ),
                          ),
                          const SizedBox(width: 8),
                          Expanded(
                            child: Container(
                              height: 60,
                              padding: const EdgeInsets.all(6),
                              decoration: BoxDecoration(border: Border.all(color: Colors.deepOrange), borderRadius: BorderRadius.circular(8)),
                              child: Row(children: [const Text("BAHAR: "), ...bahar.map((c) => Container(margin: const EdgeInsets.symmetric(horizontal: 2), padding: const EdgeInsets.all(4), color: Colors.white, child: Text(c, style: const TextStyle(color: Colors.black))))]),
                            ),
                          ),
                        ],
                      ),
                      const Spacer(),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent), onPressed: () => play("Andar"), child: const Text("BET ANDAR (₹50)")),
                          const SizedBox(width: 16),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.deepOrange), onPressed: () => play("Bahar"), child: const Text("BET BAHAR (₹50)")),
                        ],
                      ),
                      const SizedBox(height: 10),
                    ],
                  ),
                ),
              );
            }
          }

          class SevenUpPlayScreen extends StatefulWidget {
            const SevenUpPlayScreen({super.key});
            @override
            State<SevenUpPlayScreen> createState() => _SevenUpPlayScreenState();
          }

          class _SevenUpPlayScreenState extends State<SevenUpPlayScreen> {
            int d1 = 3;
            int d2 = 4;
            String msg = "Dice Roll karein (2-6, 7, ya 8-12)";

            void roll(String pick) {
              if (GameState.balance < 50) return;
              setState(() {
                GameState.balance -= 50;
                d1 = Random().nextInt(6) + 1;
                d2 = Random().nextInt(6) + 1;
                int sum = d1 + d2;
                bool win = (pick == "DOWN" && sum < 7) || (pick == "7" && sum == 7) || (pick == "UP" && sum > 7);
                if (win) {
                  GameState.balance += (pick == "7" ? 150 : 100);
                  msg = "🎉 Sum aaya $sum! Aap Jeet Gaye!";
                } else {
