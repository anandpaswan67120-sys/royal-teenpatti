name: Build Realistic Casino APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup App & Config
        run: |
          flutter create --platforms=android myapp
          cd myapp
          # Copy main.dart
          cp ../main.dart lib/main.dart
          
          # Fix Android orientation in Manifest to prevent black screen
          sed -i 's/<activity/<activity android:screenOrientation="unspecified" android:configChanges="orientation|keyboardHidden|screenSize"/g' android/app/src/main/AndroidManifest.xml
          
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-TeenPatti-Pro-APK
          path: myapp/build/app/outputs/flutter-apk/app-debug.apk
          
