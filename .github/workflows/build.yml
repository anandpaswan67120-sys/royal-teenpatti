name: Build Realistic Casino APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create App & Fetch Clean Code
        run: |
          flutter create --platforms=android myapp
          cd myapp
          curl -s https://gist.githubusercontent.com/raw/casino-teenpatti-master/main.dart -o lib/main.dart || true
          cp ../main.dart lib/main.dart || true
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-TeenPatti-Pro-APK
          path: myapp/build/app/outputs/flutter-apk/app-debug.apk
          
