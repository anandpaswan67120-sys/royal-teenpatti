name: Build Realistic Casino APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Casino Hub App
        run: |
          flutter create --platforms=android myapp
          cd myapp
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]).then((_) {
              runApp(const CasinoMasterApp());
            });
          }

          class CasinoMasterApp extends StatelessWidget {
            const CasinoMasterApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Royal Casino VIP',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF070B14),
                ),
                home: const LoginRegisterScreen(),
              );
            }
          }

          class GameState {
            static double balance = 5000.0;
            static String userName = "Player Anand";
            static bool musicOn = true;
          }

          class LoginRegisterScreen extends StatefulWidget {
            const LoginRegisterScreen({super.key});
            @override
            State<LoginRegisterScreen> createState() => _LoginRegisterScreenState();
          }

          class _LoginRegisterScreenState extends State<LoginRegisterScreen> {
            final TextEditingController _phoneController = TextEditingController(text: "9876543210");

            void enterLobby() {
              Navigator.pushReplacement(
                context,
                MaterialPageRoute(builder: (_) => const CasinoLobbyHubScreen()),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  width: double.infinity,
                  height: double.infinity,
                  decoration: const BoxDecoration(
                    gradient: RadialGradient(
                      radius: 1.2,
                      colors: [Color(0xFF2E1065), Color(0xFF090D16)],
                    ),
                  ),
                  child: Stack(
                    children: [
                      Positioned(
                        top: 12,
                        right: 16,
                        child: IconButton(
                          icon: Icon(GameState.musicOn ? Icons.music_note : Icons.music_off, color: Colors.amber, size: 28),
                          onPressed: () {
                            setState(() => GameState.musicOn = !GameState.musicOn);
                            ScaffoldMessenger.of(context).showSnackBar(
                              SnackBar(content: Text(GameState.musicOn ? "Casino Music: ON" : "Casino Music: OFF"), duration: const Duration(seconds: 1)),
                            );
                          },
                        ),
                      ),
                      Center(
                        child: Container(
                          width: 380,
                          padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 18),
                          decoration: BoxDecoration(
                            color: const Color(0xFF0F172A).withOpacity(0.9),
                            borderRadius: BorderRadius.circular(20),
                            border: Border.all(color: Colors.amber, width: 2),
                            boxShadow: [
                              BoxShadow(color: Colors.amber.withOpacity(0.3), blurRadius: 20),
                            ],
                          ),
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Row(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: const [
                                  Icon(Icons.stars, color: Colors.amber, size: 28),
                                  SizedBox(width: 8),
                                  Text("ROYAL CASINO VIP", style: TextStyle(color: Colors.amber, fontSize: 18, fontWeight: FontWeight.bold, letterSpacing: 1.5)),
                                ],
                              ),
                              const SizedBox(height: 12),
                              TextField(
                                controller: _phoneController,
                                keyboardType: TextInputType.phone,
                                decoration: InputDecoration(
                                  labelText: "Mobile Number",
                                  prefixIcon: const Icon(Icons.phone_android, color: Colors.amber),
                                  filled: true,
                                  fillColor: const Color(0xFF1E293B),
                                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(10)),
                                  isDense: true,
                                ),
                              ),
                              const SizedBox(height: 14),
                              Row(
                                children: [
                                  Expanded(
                                    child: ElevatedButton(
                                      style: ElevatedButton.styleFrom(
                                        backgroundColor: Colors.amber,
                                        foregroundColor: Colors.black,
                                        padding: const EdgeInsets.symmetric(vertical: 10),
                                      ),
                                      onPressed: enterLobby,
                                      child: const Text("LOGIN / REGISTER", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                                    ),
                                  ),
                                  const SizedBox(width: 10),
                                  Expanded(
                                    child: ElevatedButton(
                                      style: ElevatedButton.styleFrom(
                                        backgroundColor: const Color(0xFF0284C7),
                                        padding: const EdgeInsets.symmetric(vertical: 10),
                                      ),
                                      onPressed: enterLobby,
                                      child: const Text("GUEST PLAY", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                                    ),
                                  ),
                                ],
                              ),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class CasinoLobbyHubScreen extends StatefulWidget {
            const CasinoLobbyHubScreen({super.key});
            @override
            State<CasinoLobbyHubScreen> createState() => _CasinoLobbyHubScreenState();
          }

          class _CasinoLobbyHubScreenState extends State<CasinoLobbyHubScreen> {
            void openWallet() {
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF0F172A),
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16), side: const BorderSide(color: Colors.amber)),
                  title: Row(
                    children: const [
                      Icon(Icons.account_balance_wallet, color: Colors.amber),
                      SizedBox(width: 8),
                      Text("Instant UPI Wallet", style: TextStyle(color: Colors.white, fontSize: 16)),
                    ],
                  ),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Text("Balance: ₹${GameState.balance.toInt()}", style: const TextStyle(fontSize: 18, color: Colors.greenAccent, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 16),
                      const Text("Select Instant Add Cash Amount:", style: TextStyle(color: Colors.white70, fontSize: 12)),
                      const SizedBox(height: 10),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [100, 500, 1000, 2000].map((amt) => ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1E293B)),
                          onPressed: () {
                            setState(() => GameState.balance += amt);
                            Navigator.pop(ctx);
                            ScaffoldMessenger.of(context).showSnackBar(
                              SnackBar(content: Text("₹$amt added successfully via UPI!"), backgroundColor: Colors.green),
                            );
                          },
                          child: Text("+₹$amt", style: const TextStyle(color: Colors.amber)),
                        )).toList(),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text("CLOSE", style: TextStyle(color: Colors.white54))),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                      colors: [Color(0xFF1E112A), Color(0xFF070B14)],
                      begin: Alignment.topCenter,
                      end: Alignment.bottomCenter,
                    ),
                  ),
                  child: Column(
                    children: [
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                        color: Colors.black.withOpacity(0.7),
                        child: Row(
                          children: [
                            const CircleAvatar(radius: 16, backgroundColor: Colors.amber, child: Text("👑", style: TextStyle(fontSize: 16))),
                            const SizedBox(width: 8),
                            Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text(GameState.userName, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13, color: Colors.white)),
                                const Text("VIP Member", style: TextStyle(fontSize: 10, color: Colors.amberAccent)),
                              ],
                            ),
                            const Spacer(),
                            GestureDetector(
                              onTap: openWallet,
                              child: Container(
                                padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                                decoration: BoxDecoration(
                                  color: const Color(0xFF1E293B),
                                  borderRadius: BorderRadius.circular(20),
                                  border: Border.all(color: Colors.amber, width: 1.5),
                                ),
                                child: Row(
                                  children: [
                                    const Icon(Icons.monetization_on, color: Colors.amber, size: 18),
                                    const SizedBox(width: 6),
                                    Text("₹${GameState.balance.toInt()}", style: const TextStyle(color: Colors.greenAccent, fontWeight: FontWeight.bold, fontSize: 14)),
                                    const SizedBox(width: 8),
                                    Container(
                                      padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                                      decoration: BoxDecoration(color: Colors.green, borderRadius: BorderRadius.circular(10)),
                                      child: const Text("ADD CASH", style: TextStyle(color: Colors.white, fontSize: 10, fontWeight: FontWeight.bold)),
                                    ),
                                  ],
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                      Expanded(
                        child: Padding(
                          padding: const EdgeInsets.all(12),
                          child: Row(
                            children: [
                              _gameSlot("TEEN PATTI", "5-Player Oval Table", Icons.style, const [Color(0xFF831843), Color(0xFFBE123C)], () {
                                Navigator.push(context, MaterialPageRoute(builder: (_) => const TeenPattiPlayScreen())).then((_) => setState(() {}));
                              }),
                              const SizedBox(width: 10),
                              _gameSlot("DRAGON vs TIGER", "Card Clash Arena", Icons.bolt, const [Color(0xFF7C2D12), Color(0xFFEA580C)], () {
                                Navigator.push(context, MaterialPageRoute(builder: (_) => const DragonTigerPlayScreen())).then((_) => setState(() {}));
                              }),
                              const SizedBox(width: 10),
                              _gameSlot("ANDAR BAHAR", "Live Joker Deal", Icons.swap_horiz, const [Color(0xFF064E3B), Color(0xFF059669)], () {
                                Navigator.push(context, MaterialPageRoute(builder: (_) => const AndarBaharPlayScreen())).then((_) => setState(() {}));
                              }),
                              const SizedBox(width: 10),
                              _gameSlot("7 UP 7 DOWN", "Casino Dice Game", Icons.casino, const [Color(0xFF1E3A8A), Color(0xFF2563EB)], () {
                                Navigator.push(context, MaterialPageRoute(builder: (_) => const SevenUpPlayScreen())).then((_) => setState(() {}));
                              }),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _gameSlot(String title, String desc, IconData icon, List<Color> colors, VoidCallback onTap) {
              return Expanded(
                child: GestureDetector(
                  onTap: onTap,
                  child: Container(
                    decoration: BoxDecoration(
                      gradient: LinearGradient(colors: colors, begin: Alignment.topLeft, end: Alignment.bottomRight),
                      borderRadius: BorderRadius.circular(16),
                      border: Border.all(color: Colors.amber, width: 2),
                      boxShadow: [BoxShadow(color: colors.last.withOpacity(0.4), blurRadius: 10)],
                    ),
                    padding: const EdgeInsets.all(12),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                              decoration: BoxDecoration(color: Colors.black45, borderRadius: BorderRadius.circular(6)),
                              child: const Text("VIP", style: TextStyle(color: Colors.amber, fontSize: 9, fontWeight: FontWeight.bold)),
                            ),
                            Icon(icon, color: Colors.white, size: 26),
                          ],
                        ),
                        const Spacer(),
                        Text(title, style: const TextStyle(fontSize: 14, fontWeight: FontWeight.bold, color: Colors.white)),
                        Text(desc, style: const TextStyle(fontSize: 9, color: Colors.white70)),
                        const SizedBox(height: 8),
                        Container(
                          alignment: Alignment.center,
                          padding: const EdgeInsets.symmetric(vertical: 6),
                          decoration: BoxDecoration(color: Colors.amber, borderRadius: BorderRadius.circular(8)),
                          child: const Text("PLAY GAME", style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 10)),
                        )
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class TeenPattiPlayScreen extends StatefulWidget {
            const TeenPattiPlayScreen({super.key});
            @override
            State<TeenPattiPlayScreen> createState() => _TeenPattiPlayScreenState();
          }

          class _TeenPattiPlayScreenState extends State<TeenPattiPlayScreen> {
            int pot = 150;
            bool isSeen = false;
            int activeTurn = 0;
            List<String> cards = ["A♠", "K♥", "Q♦"];

            void playTurn() {
              if (GameState.balance < 20) return;
              setState(() {
                GameState.balance -= 20;
                pot += 20;
                activeTurn = 1;
              });
              Timer(const Duration(milliseconds: 1000), () {
                if (!mounted) return;
                setState(() {
                  pot += 60;
                  activeTurn = 0;
                });
              });
            }

            void showWinner() {
              setState(() => GameState.balance += pot);
              showDialog(
                context: context,
                builder: (c) => AlertDialog(
                  backgroundColor: const Color(0xFF0F172A),
                  title: const Text("🏆 ANAND WON!", style: TextStyle(color: Colors.amber, fontWeight: FontWeight.bold)),
                  content: Text("Aapne ₹$pot ka pot jeet liya! Chips wallet me add ho gaye."),
                  actions: [TextButton(onPressed: () { Navigator.pop(c); setState(() => pot = 100); }, child: const Text("NEXT ROUND"))],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    radialGradient: RadialGradient(radius: 1.2, colors: [Color(0xFF064E3B), Color(0xFF011A13)]),
                  ),
                  child: Stack(
                    children: [
                      Positioned(
                        top: 8,
                        left: 12,
        