name: Build Realistic Casino APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Casino App
        run: |
          flutter create --platforms=android mycasino
          cd mycasino
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setPreferredOrientations([
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]).then((_) => runApp(const CasinoApp()));
          }

          class Data {
            static double bal = 5000.0;
          }

          class CasinoApp extends StatelessWidget {
            const CasinoApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Royal Casino VIP',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF070B14),
                ),
                home: const LobbyScreen(),
              );
            }
          }

          class LobbyScreen extends StatefulWidget {
            const LobbyScreen({super.key});
            @override
            State<LobbyScreen> createState() => _LobbyScreenState();
          }

          class _LobbyScreenState extends State<LobbyScreen> {
            void addCash() {
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF0F172A),
                  title: const Text("UPI Wallet - Add Cash", style: TextStyle(color: Colors.amber)),
                  content: Row(
                    mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                    children: [100, 500, 1000].map((amt) => ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1E293B)),
                      onPressed: () {
                        setState(() => Data.bal += amt);
                        Navigator.pop(ctx);
                      },
                      child: Text("+₹$amt", style: const TextStyle(color: Colors.amber)),
                    )).toList(),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  title: const Text("👑 ROYAL CASINO VIP", style: TextStyle(color: Colors.amber, fontWeight: FontWeight.bold, fontSize: 16)),
                  actions: [
                    TextButton.icon(
                      icon: const Icon(Icons.add_circle, color: Colors.greenAccent),
                      label: Text("₹${Data.bal.toInt()}", style: const TextStyle(color: Colors.greenAccent, fontSize: 16, fontWeight: FontWeight.bold)),
                      onPressed: addCash,
                    ),
                    const SizedBox(width: 10),
                  ],
                ),
                body: Padding(
                  padding: const EdgeInsets.all(12),
                  child: Row(
                    children: [
                      _card("TEEN PATTI", Icons.style, Colors.purple, () => Navigator.push(context, MaterialPageRoute(builder: (_) => const TeenPattiScreen())).then((_) => setState(() {}))),
                      const SizedBox(width: 10),
                      _card("DRAGON vs TIGER", Icons.bolt, Colors.deepOrange, () => Navigator.push(context, MaterialPageRoute(builder: (_) => const DragonTigerScreen())).then((_) => setState(() {}))),
                      const SizedBox(width: 10),
                      _card("ANDAR BAHAR", Icons.swap_horiz, Colors.teal, () => Navigator.push(context, MaterialPageRoute(builder: (_) => const AndarBaharScreen())).then((_) => setState(() {}))),
                      const SizedBox(width: 10),
                      _card("7 UP 7 DOWN", Icons.casino, Colors.indigo, () => Navigator.push(context, MaterialPageRoute(builder: (_) => const SevenUpScreen())).then((_) => setState(() {}))),
                    ],
                  ),
                ),
              );
            }

            Widget _card(String name, IconData icon, Color col, VoidCallback tap) {
              return Expanded(
                child: InkWell(
                  onTap: tap,
                  child: Container(
                    decoration: BoxDecoration(
                      color: col.withOpacity(0.3),
                      borderRadius: BorderRadius.circular(12),
                      border: Border.all(color: Colors.amber, width: 2),
                    ),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Icon(icon, size: 36, color: Colors.amber),
                        const SizedBox(height: 8),
                        Text(name, textAlign: TextAlign.center, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13, color: Colors.white)),
                        const SizedBox(height: 10),
                        Container(
                          padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 4),
                          decoration: BoxDecoration(color: Colors.amber, borderRadius: BorderRadius.circular(6)),
                          child: const Text("PLAY", style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 11)),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }          class TeenPattiScreen extends StatefulWidget {
            const TeenPattiScreen({super.key});
            @override
            State<TeenPattiScreen> createState() => _TeenPattiScreenState();
          }

          class _TeenPattiScreenState extends State<TeenPattiScreen> {
            int pot = 100;
            bool seen = false;
            void chaal() {
              if (Data.bal < 20) return;
              setState(() { Data.bal -= 20; pot += 40; });
            }
            void showWin() {
              setState(() => Data.bal += pot);
              Navigator.pop(context);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text("Teen Patti - Pot: ₹$pot"), backgroundColor: const Color(0xFF064E3B)),
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      GestureDetector(
                        onTap: () => setState(() => seen = !seen),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: ["A♠", "K♥", "Q♦"].map((c) => Container(
                            margin: const EdgeInsets.all(6),
                            width: 60,
                            height: 90,
                            decoration: BoxDecoration(color: seen ? Colors.white : Colors.blueGrey, borderRadius: BorderRadius.circular(8)),
                            alignment: Alignment.center,
                            child: Text(seen ? c : "🂠", style: TextStyle(fontSize: 22, color: seen ? Colors.red : Colors.white, fontWeight: FontWeight.bold)),
                          )).toList(),
                        ),
                      ),
                      const SizedBox(height: 20),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.red), onPressed: () => Navigator.pop(context), child: const Text("PACK")),
                          const SizedBox(width: 12),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.green), onPressed: chaal, child: const Text("CHAAL ₹20")),
                          const SizedBox(width: 12),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, foregroundColor: Colors.black), onPressed: showWin, child: const Text("SHOW (WIN)")),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class DragonTigerScreen extends StatefulWidget {
            const DragonTigerScreen({super.key});
            @override
            State<DragonTigerScreen> createState() => _DragonTigerScreenState();
          }

          class _DragonTigerScreenState extends State<DragonTigerScreen> {
            String log = "Dragon ya Tiger par bet lagayein";
            void fight(String side) {
              if (Data.bal < 50) return;
              int d = Random().nextInt(13) + 1;
              int t = Random().nextInt(13) + 1;
              setState(() {
                Data.bal -= 50;
                if ((d > t && side == "Dragon") || (t > d && side == "Tiger")) {
                  Data.bal += 100;
                  log = "Jeet Gaye! ($side Card bada tha)";
                } else {
                  log = "Haar Gaye! Agli baar try karein";
                }
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text("Dragon vs Tiger"), backgroundColor: const Color(0xFF1E0A0A)),
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Text(log, style: const TextStyle(fontSize: 16, color: Colors.amber, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 24),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.red, minimumSize: const Size(120, 45)), onPressed: () => fight("Dragon"), child: const Text("DRAGON ₹50")),
                          const SizedBox(width: 20),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, foregroundColor: Colors.black, minimumSize: const Size(120, 45)), onPressed: () => fight("Tiger"), child: const Text("TIGER ₹50")),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class AndarBaharScreen extends StatefulWidget {
            const AndarBaharScreen({super.key});
            @override
            State<AndarBaharScreen> createState() => _AndarBaharScreenState();
          }

          class _AndarBaharScreenState extends State<AndarBaharScreen> {
            String msg = "Bet lagayein";
            void play(String s) {
              if (Data.bal < 50) return;
              setState(() {
                Data.bal += 50;
                msg = "$s par match hua! Jeet gaye!";
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text("Andar Bahar"), backgroundColor: const Color(0xFF042F2C)),
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Text("JOKER: K♠", style: TextStyle(fontSize: 22, color: Colors.amber, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 10),
                      Text(msg, style: const TextStyle(fontSize: 16)),
                      const SizedBox(height: 20),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent), onPressed: () => play("Andar"), child: const Text("ANDAR ₹50")),
                          const SizedBox(width: 20),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.deepOrange), onPressed: () => play("Bahar"), child: const Text("BAHAR ₹50")),
                        ],
                      )
                    ],
                  ),
                ),
              );
            }
          }

          class SevenUpScreen extends StatefulWidget {
            const SevenUpScreen({super.key});
            @override
            State<SevenUpScreen> createState() => _SevenUpScreenState();
          }

          class _SevenUpScreenState extends State<SevenUpScreen> {
            String txt = "Dice Roll Karein";
            void roll(String p) {
              if (Data.bal < 50) return;
              int sum = (Random().nextInt(6) + 1) + (Random().nextInt(6) + 1);
              setState(() {
                Data.bal -= 50;
                if ((p == "DOWN" && sum < 7) || (p == "7" && sum == 7) || (p == "UP" && sum > 7)) {
                  Data.bal += (p == "7" ? 150 : 100);
                  txt = "Sum: $sum - Jeet Gaye!";
                } else {
                  txt = "Sum: $sum - Haar Gaye!";
                }
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text("7 Up 7 Down"), backgroundColor: const Color(0xFF1E3A8A)),
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Text(txt, style: const TextStyle(fontSize: 18, color: Colors.amber, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 24),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.blue), onPressed: () => roll("DOWN"), child: const Text("7 DOWN")),
                          const SizedBox(width: 10),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.red), onPressed: () => roll("7"), child: const Text("LUCKY 7")),
                          const SizedBox(width: 10),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.green), onPressed: () => roll("UP"), child: const Text("7 UP")),
                        ],
                      )
                    ],
                  ),
                ),
              );
            }
          }
          EOF
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-TeenPatti-Pro-APK
          path: mycasino/build/app/outputs/flutter-apk/app-debug.apk

